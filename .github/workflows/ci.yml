name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lazuri
          POSTGRES_USER: lazuri
          POSTGRES_PASSWORD: lazuri
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lazuri" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lazuri:lazuri@localhost:5432/lazuri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pytest
      - name: Deploy tekshiruvi
        run: python manage.py check --deploy --settings=config.settings.prod
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-checks-1234567890
          DATABASE_URL: sqlite:///:memory:

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
