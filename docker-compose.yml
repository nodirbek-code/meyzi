services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lazuri
      POSTGRES_USER: lazuri
      POSTGRES_PASSWORD: lazuri
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazuri -d lazuri"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://lazuri:lazuri@db:5432/lazuri
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  # Har 15 soniyada: to'lanmagan bronlar muddatini tugatish (joylar qaytadi), tugagan sayohatlarni yopish,
  # adminlarga Telegram xabarlarini yuborish
  scheduler:
    build: .
    command: >
      sh -c "while true; do python manage.py process_bookings; python manage.py send_notifications; sleep 15; done"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://lazuri:lazuri@db:5432/lazuri
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

  # Next.js (dev): http://localhost:3000
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://web:8000
      WATCHPACK_POLLING: "true"   # Windows diskidan o'zgarishlarni sezish uchun
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - web

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
