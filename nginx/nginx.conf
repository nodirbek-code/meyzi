# LAZURI — nginx (prod). HTTPS'ni oldida turuvchi proksi/load balancer (yoki certbot) beradi.
upstream lazuri_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;   # tur videolari 100 MB gacha

    # Foydalanuvchi yuklagan fayllar (yopiq fayllar bu yerda EMAS — ular private_media'da)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://lazuri_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
