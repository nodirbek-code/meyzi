# MEYZI — nginx (prod). HTTPS'ni oldida turuvchi proksi/load balancer (yoki certbot) beradi.
upstream meyzi_web {
    server web:8000;
}

upstream meyzi_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 110m;   # tur videolari 100 MB gacha

    # Foydalanuvchi yuklagan fayllar (yopiq fayllar bu yerda EMAS — ular private_media'da)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # Backend: API, admin, Django static, healthcheck
    location ~ ^/(api/(v1|schema|docs|health)|admin|static)(/|$) {
        proxy_pass http://meyzi_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Qolgan hammasi — Next.js (sahifalar, /_next, /api/auth, /api/proxy)
    location / {
        proxy_pass http://meyzi_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
