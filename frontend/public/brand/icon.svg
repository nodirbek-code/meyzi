<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="LAZURI">
  <!-- Sakkiz qirrali girih yulduzi (ikki kvadrat) -->
  <g fill="#C9A227">
    <rect x="18" y="18" width="64" height="64" rx="2"/>
    <rect x="18" y="18" width="64" height="64" rx="2" transform="rotate(45 50 50)"/>
  </g>
  <!-- Lazurit medalyon -->
  <circle cx="50" cy="50" r="27" fill="#1E3A8A"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="#C9A227" stroke-width="1.6"/>
  <!-- Markaziy kichik yulduz -->
  <g fill="#E3C766">
    <rect x="41" y="41" width="18" height="18"/>
    <rect x="41" y="41" width="18" height="18" transform="rotate(45 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="4.2" fill="#1E3A8A"/>
</svg>
