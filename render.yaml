# Render Blueprint: Dashboard → New → Blueprint → shu repo.
# Eslatma: agar "meyzi-api" / "meyzi-web" nomlari band bo'lsa, Render URL'ga qo'shimcha qo'shadi —
# unda quyidagi *.onrender.com manzillarni haqiqiysiga almashtiring.
databases:
  - name: meyzi-db
    plan: free
    databaseName: meyzi
    user: meyzi

services:
  - type: web
    name: meyzi-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/
    # Free planda alohida worker yo'q — scheduler shu konteynerda fonda ishlaydi
    dockerCommand: sh scripts/render-start.sh
    envVars:
      - key: REQUIREMENTS
        value: base
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DATABASE_URL
        fromDatabase:
          name: meyzi-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: meyzi-api-chnc.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://meyzi-api-chnc.onrender.com,https://meyzi-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://meyzi-web.onrender.com
      - key: MEYZI_SITE_URL
        value: https://meyzi-api-chnc.onrender.com
      - key: MEYZI_FRONTEND_URL
        value: https://meyzi-web.onrender.com
      - key: SEED_DEMO
        value: "True"
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SERVE_MEDIA
        value: "True"
      - key: EMAIL_URL
        value: consolemail://
      - key: SMS_BACKEND
        value: console
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_ADMIN_CHAT_IDS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: meyzi-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # Build paytida ham kerak (Render env'larni Docker build-arg sifatida beradi)
      - key: NEXT_PUBLIC_API_URL
        value: https://meyzi-api-chnc.onrender.com
      - key: API_INTERNAL_URL
        value: https://meyzi-api-chnc.onrender.com
